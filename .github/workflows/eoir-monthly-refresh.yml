name: EOIR Monthly Refresh

on:
  # Weekly Saturday at 02:00 UTC (= 22:00 Friday ET, = 19:00 PT). Catches
  # early-week EOIR releases without burning Actions minutes daily. Switch
  # to a monthly cron once you trust the rhythm.
  schedule:
    - cron: '0 2 * * 6'
  # Manual trigger from the Actions tab for one-off runs.
  workflow_dispatch:
    inputs:
      release:
        description: 'Release tag YYYY-MM. Defaults to the current month.'
        required: false
      force:
        description: 'Bypass the no-change early-exit in refresh.py.'
        type: boolean
        default: false

jobs:
  refresh:
    # Use the same dedicated Windows runner for each refresh.
    runs-on: [self-hosted, windows, immigration]

    # Full canonical merges can take about nine hours.
    timeout-minutes: 720

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create venv and install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt

      - name: Run refresh
        shell: pwsh
        run: |
          # Store data beside the checkout so git clean cannot remove it.
          $env:EOIR_REFRESH_ROOT = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) 'eoir-refresh-data'
          $release = ([string]$env:EOIR_RELEASE).Trim()
          if ([string]::IsNullOrWhiteSpace($release)) {
            $release = (Get-Date -Format 'yyyy-MM')
          }
          $refreshArgs = @('--release', $release)
          if ($env:EOIR_FORCE -eq 'true') { $refreshArgs += '--force' }
          $logDir = Join-Path $env:EOIR_REFRESH_ROOT 'tmp\heartbeat'
          New-Item -ItemType Directory -Path $logDir -Force | Out-Null
          & .\.venv\Scripts\python.exe scripts\refresh.py @refreshArgs 2>&1 |
              Tee-Object -FilePath (Join-Path $logDir 'last_run.log')
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::refresh.py exited $LASTEXITCODE"
            exit $LASTEXITCODE
          }
        env:
          EOIR_RELEASE: ${{ inputs.release }}
          EOIR_FORCE: ${{ inputs.force }}
          PYTHONUNBUFFERED: '1'
          # Add refresh.py secrets here once you have any (none today).
